{% if request.query_params.get('view') == 'compact' %}
<p class="bridge-shell-links"><a class="button" href="/tools/auth-bridge">打开完整工作台</a></p>
{% include 'auth-bridge-quick.html' %}
{% else %}
<section class="bridge-shell" id="bridge-shell" aria-label="GPTAuthBridge 完整工作台">
  <div class="bridge-shell-toolbar">
    <span id="bridge-kernel-status" role="status">正在连接授权内核…</span>
    <div class="bridge-shell-actions">
      <label class="bridge-auto-save"><input type="checkbox" id="bridge-auto-save" checked>授权成功后自动保存到 Team48</label>
      <button type="button" class="button" id="bridge-import" disabled>选择 Team48 账号</button>
      <button type="button" class="button" id="bridge-save" disabled>保存结果到 Team48</button>
      <a class="button ghost" href="/tools/auth-bridge?view=compact">快速检查</a>
    </div>
  </div>
  <p id="bridge-feedback" class="bridge-shell-feedback" role="status" hidden></p>
  <p id="bridge-auto-save-status" class="bridge-shell-feedback" role="status" hidden></p>
  <button type="button" class="button" id="bridge-auto-save-retry" hidden>重试自动保存</button>
  <div id="bridge-loading" class="bridge-shell-loading" role="status">正在加载工作台…</div>
  <div id="bridge-unavailable" class="bridge-shell-feedback" role="alert" hidden>
    <p>工作台连接中断，请重新连接。</p><button type="button" class="button" id="bridge-reconnect">重新连接</button>
  </div>
  <iframe id="bridge-frame" title="GPTAuthBridge 授权工作台" referrerpolicy="same-origin" src="/auth-bridge/" hidden></iframe>
</section>
<dialog id="bridge-exchange" class="bridge-exchange" aria-labelledby="bridge-exchange-title">
  <header><h2 id="bridge-exchange-title">选择账号</h2><button type="button" class="button ghost" id="bridge-exchange-close">关闭</button></header>
  <p id="bridge-exchange-note" class="hint"></p>
  <form id="bridge-exchange-form">
    <div id="bridge-exchange-items" class="bridge-exchange-items"></div>
    <p id="bridge-exchange-error" role="alert" hidden></p>
    <label class="bridge-exchange-confirm"><input type="checkbox" id="bridge-exchange-confirm">我已核对所选账号和保存范围。</label>
    <footer><span id="bridge-exchange-count" class="hint"></span><button type="submit" class="button primary" id="bridge-exchange-submit" disabled>确认导入</button></footer>
  </form>
</dialog>
{% endif %}
